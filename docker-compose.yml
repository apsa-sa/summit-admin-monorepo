name: summit-admin-local
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: summit
      POSTGRES_PASSWORD: summit_local_only
      POSTGRES_DB: summit
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - summit-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U summit -d summit"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  summit-db:
