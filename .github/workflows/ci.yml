# SUMMIT / قمة — disposable test migrations only; no deployment.
name: SUMMIT CI

on:
  push:
    branches:
      - main
      - 'work/**'
      - 'integration/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: summit-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Typecheck, unit tests, build and security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.1'
          package-manager-cache: false

      - name: Enable the declared pnpm version
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate
          node --version
          pnpm --version

      - name: Install from committed lockfile
        run: pnpm install --frozen-lockfile

      - name: Typecheck, unit tests and browser build
        run: pnpm check

      - name: Audit publication policy
        run: pnpm audit:publication

      - name: Audit known dependency vulnerabilities
        run: pnpm audit --audit-level low

      - name: Scan Git history for secrets (Gitleaks 8.30.1)
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /repo
        run: |
          docker run --rm \
            -v "$PWD:/repo:ro" -w /repo \
            -e GIT_CONFIG_COUNT -e GIT_CONFIG_KEY_0 -e GIT_CONFIG_VALUE_0 \
            ghcr.io/gitleaks/gitleaks@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            git --no-banner --redact --log-opts="--all" .

      - name: Scan current project files for secrets
        run: |
          docker run --rm \
            -v "$PWD:/repo:ro" -w /repo \
            ghcr.io/gitleaks/gitleaks@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            dir --no-banner --redact .

  architecture-integration:
    name: Next.js proof, PostgreSQL and browser contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: summit_ci_${{ github.run_id }}_${{ github.run_attempt }}
          POSTGRES_DB: summit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d summit_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      SUMMIT_TEST_DB_APPROVED: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      PROOF_ORIGIN: http://127.0.0.1:3211
      SUMMIT_CI_DB_PASSWORD: summit_ci_${{ github.run_id }}_${{ github.run_attempt }}
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.1'
          package-manager-cache: false
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate
      - name: Configure isolated disposable test database
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const url = 'postgresql:' + '//postgres:' + process.env.SUMMIT_CI_DB_PASSWORD + '@127.0.0.1:5432/summit_test';
          appendFileSync(process.env.GITHUB_ENV, `TEST_DATABASE_URL=${url}\nDATABASE_URL=${url}\n`);
          JS
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit tests and existing browser build
        run: pnpm check
      - name: Real PostgreSQL integration and installation isolation
        run: pnpm test:integration
      - name: Production build of bounded Next.js proof
        run: pnpm proof:build
      - name: Production build of class-based reference admin
        run: pnpm admin:build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Next.js contracts and bilingual reference application journeys
        run: pnpm test:e2e

      - name: Preserve component gallery and browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: summit-ui-verification-${{ github.sha }}
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
